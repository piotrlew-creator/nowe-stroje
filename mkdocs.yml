site_name: Nowe Stroje
site_description: Zgłoszenie danych do nowych strojów sportowych
site_url: https://piotrlew-creator.github.io/nowe-stroje/

theme:
  name: material
  language: pl
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.top

nav:
  - Zgłoszenie: index.md
  - Tabela: tabela.md

extra_css:
  - css/extra.css

extra_javascript:
  - js/config.js
  - js/common.js
  - js/form.js
  - js/tabela.js
  # Uwaga: biblioteki eksportu (SheetJS, jsPDF, autoTable) NIE są tu wpisane
  # celowo — docs/js/tabela.js ładuje je leniwie z docs/js/vendor/ dopiero
  # w momencie kliknięcia przycisku eksportu, żeby nie obciążać formularza.

markdown_extensions:
  - attr_list
  - md_in_html

# Wyłączamy edycję na GitHub (nie ma potrzeby, strona jest formularzem)
edit_uri: ""
